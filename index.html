<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LubuMarket">
<meta name="theme-color" content="#0A1A3F">
<title>LubuMarket</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#F2F5FC;--card:#fff;--ink:#0A1A3F;--mut:#5A6580;--blue:#1D4ED8;--line:#E1E7F5;--ok:#15803D;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#060C1C;--card:#0E1830;--ink:#EEF3FF;--mut:#98A5C0;--blue:#4F8BFF;--line:#1C2A4A;color-scheme:dark}}
*,*:before,*:after{box-sizing:inherit}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.lg{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:32px 24px 40px;color:#fff;background:radial-gradient(120% 70% at 85% 0,#1D4ED8 0,transparent 60%),#050B1F}
.lg h1{font-size:40px;line-height:1.05;letter-spacing:-1.5px;margin:0 0 12px;font-weight:800;max-width:11em}
.lg p{margin:0 0 28px;color:#B7C4E6;max-width:26em}
.lg .logo{position:absolute;top:calc(24px + env(safe-area-inset-top,0));left:24px}
.g{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:420px;border:0;border-radius:14px;padding:16px;background:#fff;color:#0A1A3F;font:inherit;font-weight:700;cursor:pointer}
.g b{font-size:20px;color:#1D4ED8}
.err{color:#FCA5A5;margin-top:12px;font-size:13px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--blue)}.lg .logo b{color:#7FA6FF}
.w{max-width:720px;margin:0 auto;padding:0 16px 96px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px 4px 4px;font:inherit;font-size:13px;cursor:pointer}
.me img,.me i{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
input,select,textarea{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}
.hero{margin:12px 0 16px;padding:26px 20px;border-radius:24px;color:#fff;background:radial-gradient(90% 120% at 100% 0,#2F63F0 0,transparent 55%),#07122E}
.hero h1{margin:0 0 6px;font-size:26px;line-height:1.12;letter-spacing:-.8px;font-weight:800}.hero p{margin:0;color:#B7C4E6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 12px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip i{font-style:normal;opacity:.55;margin-left:6px}.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;gap:12px}
.bar h2{margin:0;font-size:19px;letter-spacing:-.3px}.bar select{width:auto;padding:9px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.ph{position:relative;aspect-ratio:1;background:var(--line)}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.bs{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.b{font-size:11px;font-weight:700;border-radius:999px;padding:4px 9px;color:#fff;background:var(--ok)}.b.nw{background:var(--blue)}
.fav{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.in{padding:10px 12px 14px}.in h3{margin:0 0 4px;font-size:14px;font-weight:600}.pr{font-weight:800;font-size:16px}.mu{color:var(--mut);font-size:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
.ovl{position:fixed;inset:0;background:rgba(3,7,18,.65);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;position:relative;padding-bottom:env(safe-area-inset-bottom,0)}
.pd{padding:20px 16px 24px}
.x{position:absolute;right:12px;top:12px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--line)}.gal img{flex:none;width:100%;max-height:60vh;aspect-ratio:1;object-fit:cover;scroll-snap-align:center}
.sheet h2{margin:8px 0 4px;font-size:21px;letter-spacing:-.4px}
.btn{display:block;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:700;background:var(--blue);color:#fff;cursor:pointer;text-align:center;text-decoration:none;width:100%}
.btn.wa{background:#15803D;margin-top:14px}.btn.o{background:transparent;color:var(--blue);border:1px solid var(--line);margin-top:8px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.row span{flex:1}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
#adm{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:10;width:auto;box-shadow:0 8px 24px rgba(29,78,216,.4)}
</style></head>
<body>
<section class="lg" id="login" hidden>
<div class="logo">Lubu<b>Market</b></div>
<h1>Les bons articles, à Lubumbashi.</h1>
<p>Connectez-vous avec Google pour voir ce qui est en stock à la boutique et commander sur WhatsApp.</p>
<button class="g" id="gbtn"><b>G</b> Continuer avec Google</button>
<div class="err" id="err"></div>
</section>
<div class="w" id="app" hidden>
<header><div class="logo">Lubu<b>Market</b></div><button class="me" id="me"></button></header>
<input id="q" type="search" placeholder="Rechercher un article">
<section class="hero"><h1>En stock à la boutique</h1><p>Tout ce que vous voyez est disponible maintenant.</p></section>
<div class="chips" id="chips"></div>
<div class="bar"><h2>Articles (<span id="count">0</span>)</h2><select id="sort"><option value="new">Récents</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option></select></div>
<div class="grid" id="grid"></div>
</div>
<button class="btn" id="adm" hidden>Espace gérant</button>
<div class="ovl" id="ov" hidden></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,setDoc,deleteDoc,updateDoc,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* 1) Collez ici la configuration de votre application web Firebase */
const firebaseConfig={apiKey:"AIzaSyAbx13iRKix9bBchIv5YK_sJXbUYYRJ8Yo",authDomain:"lubumarket-29a24.firebaseapp.com",projectId:"lubumarket-29a24",storageBucket:"lubumarket-29a24.firebasestorage.app",messagingSenderId:"1085554582697",appId:"1:1085554582697:web:dd305cfbc26240869c35b8"};
const OWNER="djodjojsk6@gmail.com";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const CATS=['Téléphones','Ordinateurs','Accessoires','Beauté & mode femme','Vêtements','Maison'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fc=n=>Number(n).toLocaleString('fr-FR')+' FC';
let U=null,isOwner=false,P=[],favs=[],WA='',unsub=[];
const st={cat:'Tout',q:'',sort:'new'};

$('#gbtn').onclick=async()=>{
  const pr=new GoogleAuthProvider();$('#err').textContent='';
  try{await signInWithPopup(auth,pr)}catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')return signInWithRedirect(auth,pr);
    if(e.code!=='auth/popup-closed-by-user')$('#err').textContent='Connexion impossible. Réessayez.';
  }
};
onAuthStateChanged(auth,u=>{
  unsub.forEach(f=>f());unsub=[];U=u;
  $('#login').hidden=!!u;$('#app').hidden=!u;
  if(!u){$('#adm').hidden=true;return}
  isOwner=u.email===OWNER&&u.emailVerified;$('#adm').hidden=!isOwner;
  $('#me').innerHTML=(u.photoURL?`<img src="${esc(u.photoURL)}" alt="">`:`<i>${esc((u.displayName||'?')[0])}</i>`)+esc((u.displayName||'Moi').split(' ')[0]);
  const er=()=>{};
  unsub.push(onSnapshot(collection(db,'products'),s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));renderList()},er));
  unsub.push(onSnapshot(doc(db,'settings','shop'),s=>{WA=(s.data()||{}).whatsapp||''},er));
  unsub.push(onSnapshot(doc(db,'users',u.uid),s=>{favs=(s.data()||{}).favs||[];renderList()},er));
  setDoc(doc(db,'users',u.uid),{name:u.displayName||'',email:u.email||''},{merge:true}).catch(er);
});

function list(){
  const q=st.q.toLowerCase();
  const a=P.filter(p=>(st.cat==='Tout'||p.cat===st.cat)&&(!q||((p.name||'')+' '+(p.desc||'')).toLowerCase().includes(q)));
  if(st.sort==='asc')a.sort((x,y)=>x.fc-y.fc);else if(st.sort==='desc')a.sort((x,y)=>y.fc-x.fc);else a.sort((x,y)=>y.date-x.date);
  return a;
}
function card(p){
  const nw=Date.now()-p.date<7*864e5,im=p.imgs||[];
  return `<article class="card" data-id="${esc(p.id)}"><div class="ph">${im[0]?`<img loading="lazy" src="${esc(im[0])}" alt="">`:''}<div class="bs"><span class="b">En stock</span>${nw?'<span class="b nw">Nouveau</span>':''}</div><button class="fav" data-fav="${esc(p.id)}">${favs.includes(p.id)?'♥':'♡'}</button></div><div class="in"><h3>${esc(p.name)}</h3><div class="pr">${fc(p.fc)}</div>${p.usd?`<div class="mu">≈ ${esc(p.usd)} $</div>`:''}</div></article>`;
}
function renderList(){
  $('#chips').innerHTML=['Tout',...CATS].map(c=>{const n=c==='Tout'?P.length:P.filter(p=>p.cat===c).length;return `<button class="chip${st.cat===c?' on':''}" data-cat="${esc(c)}">${esc(c)}<i>${n}</i></button>`}).join('');
  const a=list();$('#count').textContent=a.length;
  $('#grid').innerHTML=a.length?a.map(card).join(''):'<p class="empty">Aucun article pour le moment. Revenez bientôt.</p>';
}
const ov=h=>{$('#ov').innerHTML=h;$('#ov').hidden=false};
const closeOv=()=>{$('#ov').hidden=true;$('#ov').innerHTML=''};

function detail(id){
  const p=P.find(x=>x.id===id);if(!p)return;
  const nm=((U&&U.displayName)||'').split(' ')[0];
  const msg=`Bonjour LubuMarket, ${nm?'c’est '+nm+'. ':''}Je suis intéressé(e) par : ${p.name} à ${fc(p.fc)}. Est-il toujours disponible ?`;
  const wa=WA?`https://wa.me/${esc(WA)}?text=${encodeURIComponent(msg)}`:'';
  const sh=`https://wa.me/?text=${encodeURIComponent(p.name+' – '+fc(p.fc)+' '+location.origin)}`;
  const im=p.imgs||[];
  ov(`<div class="sheet"><button class="x" data-close>✕</button>${im.length?`<div class="gal">${im.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>`:''}<div class="pd"><span class="b">${esc(p.etat)} · En stock</span><h2>${esc(p.name)}</h2><div class="pr" style="font-size:22px">${fc(p.fc)}</div>${p.usd?`<div class="mu">≈ ${esc(p.usd)} $</div>`:''}<p>${esc(p.desc)}</p>${wa?`<a class="btn wa" href="${wa}" target="_blank" rel="noopener">Commander via WhatsApp</a>`:'<p class="mu">Le contact WhatsApp arrive bientôt.</p>'}<a class="btn o" href="${sh}" target="_blank" rel="noopener">Partager à une amie</a></div></div>`);
}
function admin(){
  if(!isOwner)return;
  ov(`<div class="sheet pd"><button class="x" data-close>✕</button><h2>Espace gérant</h2>
<form id="f"><label>Nom de l’article</label><input name="name" required>
<label>Catégorie</label><select name="cat">${CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
<label>Prix en FC</label><input name="fc" type="number" min="0" required>
<label>Prix en USD (facultatif)</label><input name="usd" type="number" min="0" step="0.01">
<label>État</label><select name="etat"><option>Neuf</option><option>Très bon</option><option>Bon</option></select>
<label>Quantité en stock</label><input name="qty" type="number" min="1" value="1" required>
<label>Description</label><textarea name="desc" rows="3"></textarea>
<label>Photos (1 à 3)</label><input name="ph" type="file" accept="image/*" multiple>
<button class="btn" id="pub" style="margin-top:14px">Publier</button></form>
<h3>Stock actuel</h3>${P.map(p=>`<div class="row"><span>${esc(p.name)} ×${esc(p.qty)}</span><button class="mini" data-sold="${esc(p.id)}">Vendu</button><button class="mini" data-del="${esc(p.id)}">Supprimer</button></div>`).join('')||'<p class="mu">Aucun article.</p>'}
<h3>Numéro WhatsApp</h3><input id="wan" inputmode="numeric" placeholder="243XXXXXXXXX" value="${esc(WA)}"><button class="btn" data-wa style="margin-top:8px">Enregistrer le numéro</button></div>`);
}
const shrink=f=>new Promise((r,j)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.onerror=j;i.src=URL.createObjectURL(f)});

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-cat],[data-fav],[data-id],[data-close],[data-sold],[data-del],[data-wa],#adm,#me');
  if(!t){if(e.target.id==='ov')closeOv();return}
  const d=t.dataset;
  try{
    if(d.fav){e.stopPropagation();await setDoc(doc(db,'users',U.uid),{favs:favs.includes(d.fav)?arrayRemove(d.fav):arrayUnion(d.fav)},{merge:true});return}
    if(d.cat){st.cat=d.cat;renderList();return}
    if(d.id){detail(d.id);return}
    if('close' in d){closeOv();return}
    if(t.id==='adm'){admin();return}
    if(t.id==='me'){if(confirm('Se déconnecter ?'))signOut(auth);return}
    if(!isOwner)return;
    if(d.sold){const p=P.find(x=>x.id===d.sold);if(p){if(p.qty>1)await updateDoc(doc(db,'products',p.id),{qty:p.qty-1});else await deleteDoc(doc(db,'products',p.id))}admin();return}
    if(d.del){await deleteDoc(doc(db,'products',d.del));admin();return}
    if('wa' in d){await setDoc(doc(db,'settings','shop'),{whatsapp:($('#wan').value||'').replace(/\D/g,'')});closeOv()}
  }catch(err){alert('Action refusée ou connexion perdue. Réessayez.')}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='f')return;e.preventDefault();if(!isOwner)return;
  const f=e.target,fd=new FormData(f),btn=$('#pub');btn.disabled=true;btn.textContent='Publication…';
  try{
    const imgs=[];for(const file of [...f.ph.files].slice(0,3))imgs.push(await shrink(file));
    await addDoc(collection(db,'products'),{name:fd.get('name'),cat:fd.get('cat'),fc:+fd.get('fc'),usd:fd.get('usd')||'',etat:fd.get('etat'),qty:+fd.get('qty'),desc:fd.get('desc')||'',imgs,date:Date.now()});
    closeOv();
  }catch(err){alert('Publication impossible. Vérifiez votre connexion.');btn.disabled=false;btn.textContent='Publier'}
});
$('#q').oninput=e=>{st.q=e.target.value;renderList()};
$('#sort').onchange=e=>{st.sort=e.target.value;renderList()};
</script>
</body></html>
